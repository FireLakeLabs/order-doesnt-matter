<div style="position: absolute; left: 24px; top: 18px; display: flex; align-items: center; gap: 12px">

<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px">Ash Run · parts sheet</h1>
<span style="font-size: 12px; padding: 3px 10px; border: 1px solid #2A2545; border-radius: 999px; color: #A49EC4">our own runner, no cape</span>

<div style="position: absolute; right: 24px; top: 20px; max-width: 360px; text-align: right; font-size: 12px; line-height: 1.5; color: #D9D4F2">Today: a roof per bass note, a hop per onset, long floats over rests, see-through city, hard landings.</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const R = Math.PI / 180;
const f = (n) => n.toFixed(1);
const step = (p, a, l) => [p[0] + Math.sin(a * R) * l, p[1] + Math.cos(a * R) * l];
const line = (pts) => 'M ' + pts.map((p) => f(p[0]) + ' ' + f(p[1])).join(' L ');
const figure = (x, y, s, p) => {
const hip = [x, y - p.h * s];
const u = [Math.sin(p.lean * R), -Math.cos(p.lean * R)];
const back = [-Math.cos(p.lean * R), -Math.sin(p.lean * R)];
const along = (k) => [hip[0] + u[0] * k * s, hip[1] + u[1] * k * s];
const neck = along(0.3), shoulder = along(0.27);
const leg = (t, sh) => { const k = step(hip, t, 0.27 * s); return line([hip, k, step(k, sh, 0.27 * s)]); };
const arm = (a, fa) => { const e = step(shoulder, a, 0.16 * s); return line([shoulder, e, step(e, fa, 0.15 * s)]); };
const head = [neck[0] + u[0] * 0.1 * s, neck[1] + u[1] * 0.1 * s], r = 0.075 * s;
const p1 = along(0.4), p2 = along(0.82);
const off = (q) => [q[0] + back[0] * 0.1 * s, q[1] + back[1] * 0.1 * s];
return {
far: leg(p.ft, p.fs) + ' ' + arm(p.fa, p.ff),
near: leg(p.nt, p.ns) + ' ' + arm(p.na, p.nf),
torso: line([hip, neck]),
pack: line([p1, p2, off(p2), off(p1)]) + ' Z',
head: 'M ' + f(head[0] - r) + ' ' + f(head[1]) + ' a ' + f(r) + ' ' + f(r) + ' 0 1 0 ' + f(2 * r) + ' 0 a ' + f(r) + ' ' + f(r) + ' 0 1 0 ' + f(-2 * r) + ' 0',
visor: 'M ' + f(head[0] + r * 0.25) + ' ' + f(head[1] - r * 0.2) + ' L ' + f(head[0] + r * 1.05) + ' ' + f(head[1] + r * 0.05),
};
};
const S = 54;
const contact = { h: 0.5, lean: 12, nt: 28, ns: 8, ft: -25, fs: -90, na: -40, nf: 30, fa: 35, ff: 120 };
const poses = [
[80, 186, contact],
[200, 186, { h: 0.5, lean: 14, nt: 15, ns: -25, ft: -10, fs: -115, na: -30, nf: 40, fa: 25, ff: 110 }],
[320, 186, { h: 0.52, lean: 14, nt: -12, ns: -20, ft: 35, fs: -55, na: -15, nf: 60, fa: 15, ff: 90 }],
[440, 186, { h: 0.47, lean: 16, nt: -25, ns: -32, ft: 60, fs: -5, na: 40, nf: 125, fa: -45, ff: 20 }],
[560, 180, { h: 0.56, lean: 14, nt: -30, ns: -75, ft: 45, fs: 15, na: 35, nf: 120, fa: -40, ff: 25 }],
[680, 186, { h: 0.5, lean: 12, nt: -25, ns: -90, ft: 28, fs: 8, na: 35, nf: 120, fa: -40, ff: 30 }],
[300, 340, { h: 0.46, lean: 20, nt: -30, ns: -35, ft: 70, fs: 0, na: 60, nf: 150, fa: 50, ff: 140 }],
[352, 312, { h: 0.5, lean: 18, nt: 75, ns: -20, ft: 55, fs: -50, na: 70, nf: 140, fa: 60, ff: 130 }],
[392, 300, { h: 0.5, lean: 10, nt: 50, ns: 0, ft: 30, fs: -30, na: 100, nf: 120, fa: -60, ff: -20 }],
[430, 320, { h: 0.5, lean: 5, nt: 40, ns: 20, ft: 25, fs: 10, na: -60, nf: -110, fa: -40, ff: -90 }],
[466, 350, { h: 0.38, lean: 30, nt: 60, ns: -35, ft: 45, fs: -40, na: 50, nf: 80, fa: 40, ff: 70 }],
[530, 350, contact],
[628, 290, { h: 0.5, lean: 12, nt: 28, ns: 8, ft: -25, fs: -90, na: -40, nf: 30, fa: 35, ff: 120 }],
[678, 320, { h: 0.5, lean: 4, nt: 10, ns: 0, ft: -5, fs: -20, na: 150, nf: 170, fa: 140, ff: 170 }],
[716, 350, { h: 0.34, lean: 42, nt: 70, ns: -40, ft: 60, fs: -45, na: 40, nf: 60, fa: 30, ff: 50 }],
[870, 350, { h: 0.52, lean: 14, nt: -12, ns: -20, ft: 35, fs: -55, na: -15, nf: 60, fa: 15, ff: 90 }],
[100, 588, { h: 0.47, lean: 16, nt: -25, ns: -32, ft: 60, fs: -5, na: 40, nf: 125, fa: -45, ff: 20 }],
[152, 572, { h: 0.55, lean: 62, nt: 80, ns: 30, ft: 60, fs: 10, na: 8, nf: 0, fa: 15, ff: 5 }],
[214, 588, contact],
[372, 588, { h: 0.47, lean: 34, nt: -25, ns: -32, ft: 60, fs: -5, na: 70, nf: 60, fa: 60, ff: 40 }],
];
const all = poses.map((p) => figure(p[0], p[1], S, p[2]));
const join = (k) => all.map((g) => g[k]).join(' ');
return { figs: { far: join('far'), near: join('near'), torso: join('torso'), pack: join('pack'), head: join('head'), visor: join('visor') } };
}
}
</script>
