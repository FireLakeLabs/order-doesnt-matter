name: Check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:boundaries
      - run: npm run build
      - run: npm ci --prefix infra
      - run: npm test --prefix infra
      - run: npx --no-install cdk synth OrderDoesntMatter --strict --quiet
        working-directory: infra

  browser:
    name: Browser (${{ matrix.suite }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [studio, views]
        shard: ['1/2', '2/2']
        include:
          - suite: engine
            shard: '1/1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:${{ matrix.suite }} -- --shard=${{ matrix.shard }}
        env:
          ODM_PROFILE_PATH: browser-results/${{ matrix.suite }}-${{ strategy.job-index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.suite }}-${{ strategy.job-index }}-evidence
          path: |
            browser-results/
            .browser-build-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  check:
    if: always()
    needs: [code, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: test '${{ needs.code.result }}' = success && test '${{ needs.browser.result }}' = success
