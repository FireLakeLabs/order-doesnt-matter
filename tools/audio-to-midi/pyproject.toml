[project]
name = "audio-to-midi"
version = "0.1.0"
description = "Turn a song (audio file or YouTube URL) into multitrack MIDI"
requires-python = ">=3.10,<3.11"
dependencies = [
  "yt-dlp[default]",
  "demucs>=4.1",
  "basic-pitch==0.4.0",
  "onnxruntime",
  "beat-this>=1.1",
  "adtof-pytorch @ git+https://github.com/xavriley/ADTOF-pytorch@85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "soundfile",
  "mido",
  "numpy<2",
  "setuptools<81",  # resampy (via basic-pitch) imports pkg_resources
]

[tool.uv]
package = false
# Resolve for Linux only; demucs caps torch below 2.3 on Intel macOS.
environments = ["sys_platform == 'linux'"]

# CPU builds of PyTorch. Remove these two blocks to get the default (CUDA) builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
